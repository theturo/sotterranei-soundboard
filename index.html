<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#04060f">
<title>Shadow</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="lock" class="lock" hidden>
  <div class="moon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></div>
  <h1>Shadow</h1>
  <form id="lockForm" autocomplete="off">
    <label for="pw" class="sr">Password</label>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" enterkeyhint="go">
    <label class="check"><input id="remember" type="checkbox" checked> Ricordala su questo dispositivo</label>
    <button id="unlock" type="submit">Apri</button>
    <p id="lockMsg" class="msg" role="status"></p>
  </form>
  <div id="prog" class="prog" hidden><div id="progBar"></div><span id="progTxt"></span></div>
</section>

<div id="app" hidden>
  <header>
    <h1>Shadow</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tabScena" aria-selected="true">Scena</button>
      <button role="tab" id="tabLib" aria-selected="false">Libreria</button>
    </nav>
    <button id="btnSet" class="icon" aria-label="Impostazioni">⚙</button>
  </header>

  <main id="viewScena"><div id="grid" class="grid"></div></main>

  <main id="viewLib" hidden>
    <div class="libtop">
      <input id="search" type="search" placeholder="Cerca una frase…" autocomplete="off">
      <div id="chips" class="chips"></div>
    </div>
    <ul id="list" class="list"></ul>
  </main>

  <footer id="bar" class="bar">
    <div class="now" aria-live="polite">
      <div id="nowCat" class="nowcat">Pronto</div>
      <div id="nowTxt" class="nowtxt">Tocca un contesto per far parlare l'araldo.</div>
    </div>
    <div class="ctrl">
      <button id="bStop" aria-label="Stop">■</button>
      <button id="bRep" aria-label="Ripeti">↺</button>
      <button id="bNext" aria-label="Un'altra" class="main">⏭</button>
    </div>
  </footer>
</div>

<dialog id="settings">
  <h2>Impostazioni</h2>
  <label class="row"><input id="optVib" type="checkbox"> Vibrazione al tocco</label>
  <label class="row"><input id="optWake" type="checkbox"> Tieni lo schermo acceso</label>
  <label class="row"><input id="optText" type="checkbox"> Mostra il testo della frase</label>
  <button id="bReset" class="ghost">Azzera lo storico delle estrazioni</button>
  <button id="bForget" class="ghost danger">Dimentica password e audio offline</button>
  <button id="bUpd" class="ghost">Controlla aggiornamenti</button>
  <p id="ver" class="small"></p>
  <button id="bClose" class="main">Chiudi</button>
</dialog>

<div id="upd" class="upd" hidden role="alert">
  <span>Nuova versione disponibile</span>
  <button id="updBtn" class="main">Aggiorna</button>
  <button id="updX" aria-label="Più tardi">✕</button>
</div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
